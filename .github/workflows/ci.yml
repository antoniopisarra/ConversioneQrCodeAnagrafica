name: Build and test
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ConversioneQrCodeAnagrafica.sln
      - run: dotnet build ConversioneQrCodeAnagrafica.sln -c Release --no-restore
      - run: dotnet test ConversioneQrCodeAnagrafica.sln -c Release --no-build --logger trx --results-directory TestResults
      - run: dotnet run --project examples/ConsoleDemo -c Release --no-build
      - run: dotnet pack ConversioneQrCodeAnagrafica -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-${{ matrix.os }}
          path: |
            TestResults/*.trx
            artifacts/*.nupkg
