name: Publish NuGet
on:
  workflow_dispatch:
    inputs:
      nuget_user:
        description: 'NuGet profile owning the Trusted Publishing policy (not email)'
        required: true
        default: '53PHIR07'
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ConversioneQrCodeAnagrafica.sln
      - run: dotnet build ConversioneQrCodeAnagrafica.sln -c Release --no-restore
      - run: dotnet test ConversioneQrCodeAnagrafica.sln -c Release --no-build
      - run: dotnet pack ConversioneQrCodeAnagrafica -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-release
          path: artifacts/*.nupkg
      - name: Authenticate with NuGet using OIDC
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ inputs.nuget_user }}
      - name: Publish package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'artifacts/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
